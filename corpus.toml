# Concern: names the third-party repositories the corpus tests measure, pinned by SHA | Non-concern: fetching them, or what is asserted over them | IO: none
# Nothing is vendored: fetch-corpus.sh clones each `rev` into gitignored target/corpus/.
# A `rev` is a commit SHA, never a tag — a tag can move, and the assertions would drift.

