# Concern: the shipped thresholds and the per-language comment, string and heredoc markers | Non-concern: resolving these against the config layers (config.rs) | IO: none
# Every threshold ships ON and DENYING: a budget nobody enables measures nothing.

[global]
# Directory names pruned from every walk, on top of .gitignore.
exclude = ["target", "node_modules", "vendor", "dist", "build", ".venv"]

[rules.comment-ratio]
# Characters, not lines, so a trailing `// why` costs what it occupies.
level = "deny"
# Measured: the 38 pinned corpus repositories run to a median of 15.5% (1.3% to 44.8%).
max_ratio = 0.15
# Doc comments count too; at file scope they are usually the larger share.
count_doc_comments = true
# Below this, a stub would be trivially "100% comments".
min_chars = 200
# A fixed per-file cost the body is not charged for; header_max_lines bounds the banner itself.
skip_header = true

[rules.comment-block]
# One block comment, or one unbroken run of adjacent line comments.
level = "deny"
# Policy, not a measurement: the corpus trips this 13089 times at 1, still 4309 at 5.
max_lines = 1
doc_max_lines = 10
header_max_lines = 30
max_chars = 400

# A file whose language resolved but whose bytes are not text.
[rules.unreadable]
level = "deny"

[rules.doc-length]
# Applies to `prose = true` languages only. Code files are bounded by comment-ratio.
level = "deny"
# Measured: the 75th percentile of the corpus's 668 prose documents. Their median is 22.
max_lines = 77

# Every knob below is documented under LANGUAGE TABLE in `comment-crusher --help`.

# Referenced by `embed_use`. One home for the pair every HTML-family entry shares.
[embed_sets]
web = [
  { open = "<script", close = "</script", default = "javascript", attrs = ["type", "lang"], map = { ts = "typescript", tsx = "typescript", typescript = "typescript", "text/typescript" = "typescript", "application/typescript" = "typescript", js = "javascript", jsx = "javascript", module = "javascript", "text/babel" = "javascript", "application/json" = "json", "application/ld+json" = "json", importmap = "json", speculationrules = "json", "text/x-template" = "html", "text/template" = "html", "text/coffeescript" = "coffee", "text/x-coffeescript" = "coffee", "text/x-literate-coffeescript" = "coffee", "text/css" = "css" } },
  { open = "<style", close = "</style", default = "css", attrs = ["lang"], map = { scss = "css", sass = "css", less = "css", postcss = "css", stylus = "stylus", styl = "stylus" } },
]

[languages.rust]
extensions = [".rs"]
line = ["//"]
doc_line = ["///", "//!"]
block = [["/*", "*/"]]
doc_block = [["/**", "*/"], ["/*!", "*/"]]
nested_block = true
hash_raw_strings = true
strings = [
  { open = '"', close = '"', multiline = true },
  { open = "'", close = "'", char_literal = true },
]

