filenames = ["tsconfig.json", "jsconfig.json", "devcontainer.json"]
line = ["//"]
block = [["/*", "*/"]]
strings = [{ open = '"', close = '"' }]

[languages.cue]
extensions = [".cue"]
line = ["//"]
strings = [{ open = '"""', close = '"""', multiline = true }, { open = '"', close = '"' }]

[languages.rego]
extensions = [".rego"]
line = ["#"]
strings = [{ open = '"', close = '"' }]

[languages.thrift]
extensions = [".thrift"]
line = ["//", "#"]
block = [["/*", "*/"]]
strings = [{ open = '"', close = '"' }, { open = "'", close = "'" }]

[languages.bicep]
extensions = [".bicep"]
line = ["//"]
strings = [{ open = "'''", close = "'''", multiline = true }, { open = "'", close = "'" }]

[languages.dotenv]
extensions = [".env"]
filenames = [".env", ".env.example", ".env.local", ".env.sample"]
line = ["#"]

# --- Templates and styling ---

[languages.stylus]
extensions = [".styl"]
line = ["//"]
block = [["/*", "*/"]]

[languages.pug]
extensions = [".pug", ".jade"]
line = ["//-", "//"]

[languages.handlebars]
extensions = [".hbs", ".handlebars", ".mustache"]
block = [["{{!--", "--}}"], ["{{!", "}}"]]

[languages.jinja]
extensions = [".j2", ".jinja", ".jinja2", ".twig"]
block = [["{#", "#}"]]

# --- Prose ---

[languages.markdown]
extensions = [".md", ".markdown", ".mdx"]
block = [["<!--", "-->"]]
prose = true

[languages.restructuredtext]
extensions = [".rst"]
prose = true

[languages.asciidoc]
extensions = [".adoc", ".asciidoc"]
line = ["//"]
prose = true

[languages.plaintext]
extensions = [".txt", ".text", ".org"]
prose = true
