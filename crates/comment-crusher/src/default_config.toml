[languages.html]
# `<script>` and `<style>` hold another language, and its comments are comments. The child is
# NAMED by the tag, never guessed: `type="application/json"` resolves to `json`, which is not
# a language here, so that body stays code. Matching the literal `</script` is what the HTML
# spec's own script-data state does, so no HTML parser buys anything here.
#   open / close       delimiters; one starting with `<` is a tag, so its body starts past `>`
#   default            the child language when no attribute names one
#   attrs / map        tag attributes that may name the child, and the value -> language map
#   at_start           matches only at byte zero, which is what makes a `---` fence safe
#   balanced           ends at the `close` balancing this `open`, not the first one
#   skip               text after `open` that cancels the match: `{#if` is a directive
extensions = [".html", ".htm", ".xml", ".xhtml", ".svg"]
block = [["<!--", "-->"]]
strings = [{ open = '"', close = '"' }, { open = "'", close = "'" }]
embed = [
  { open = "<script", close = "</script", default = "javascript", attrs = ["type", "lang"], map = { ts = "typescript", tsx = "typescript", typescript = "typescript", "text/typescript" = "typescript", "application/typescript" = "typescript", js = "javascript", jsx = "javascript", module = "javascript", "text/babel" = "javascript", "application/json" = "json", "application/ld+json" = "json", importmap = "json", speculationrules = "json", "text/x-template" = "html" } },
  { open = "<style", close = "</style", default = "css", attrs = ["lang"], map = { scss = "css", sass = "css", less = "css", postcss = "css", stylus = "stylus", styl = "stylus" } },
]

[languages.vue]
extensions = [".vue"]
block = [["<!--", "-->"]]
strings = [{ open = '"', close = '"' }, { open = "'", close = "'" }]
embed = [
  { open = "<script", close = "</script", default = "javascript", attrs = ["type", "lang"], map = { ts = "typescript", tsx = "typescript", typescript = "typescript", "text/typescript" = "typescript", "application/typescript" = "typescript", js = "javascript", jsx = "javascript", module = "javascript", "text/babel" = "javascript", "application/json" = "json", "application/ld+json" = "json", importmap = "json", speculationrules = "json", "text/x-template" = "html" } },
  { open = "<style", close = "</style", default = "css", attrs = ["lang"], map = { scss = "css", sass = "css", less = "css", postcss = "css", stylus = "stylus", styl = "stylus" } },
  { open = "<template", close = "</template", default = "html", attrs = ["lang"], map = { pug = "pug", jade = "pug" } },
  # `{{ x }}` interpolation. A lone `{` is ordinary text in a Vue template, so only the
  # doubled form is an expression.
  { open = "{{", close = "}}", default = "javascript" },
]

[languages.svelte]
# Most of a component's logic lives in `{...}` markup expressions rather than in `<script>`,
# so without the last entry a Svelte file reads as having no comments at all. A literal brace
# in Svelte text must be escaped, which is what makes matching a bare `{` safe here.
extensions = [".svelte"]
block = [["<!--", "-->"]]
strings = [{ open = '"', close = '"' }, { open = "'", close = "'" }]
embed = [
  { open = "<script", close = "</script", default = "javascript", attrs = ["type", "lang"], map = { ts = "typescript", tsx = "typescript", typescript = "typescript", "text/typescript" = "typescript", "application/typescript" = "typescript", js = "javascript", jsx = "javascript", module = "javascript", "text/babel" = "javascript", "application/json" = "json", "application/ld+json" = "json", importmap = "json", speculationrules = "json", "text/x-template" = "html" } },
  { open = "<style", close = "</style", default = "css", attrs = ["lang"], map = { scss = "css", sass = "css", less = "css", postcss = "css", stylus = "stylus", styl = "stylus" } },
  { open = "{", close = "}", default = "javascript", balanced = true, skip = ["#", ":", "/", "@"] },
]

[languages.astro]
# The `---` frontmatter fence is matched only at byte zero, so the same three characters in
# the markup below it stay content.
extensions = [".astro"]
block = [["<!--", "-->"]]
strings = [{ open = '"', close = '"' }, { open = "'", close = "'" }]
embed = [
  { open = "---", close = "---", default = "typescript", at_start = true },
  { open = "<script", close = "</script", default = "javascript", attrs = ["type", "lang"], map = { ts = "typescript", tsx = "typescript", typescript = "typescript", "text/typescript" = "typescript", "application/typescript" = "typescript", js = "javascript", jsx = "javascript", module = "javascript", "text/babel" = "javascript", "application/json" = "json", "application/ld+json" = "json", importmap = "json", speculationrules = "json", "text/x-template" = "html" } },
  { open = "<style", close = "</style", default = "css", attrs = ["lang"], map = { scss = "css", sass = "css", less = "css", postcss = "css", stylus = "stylus", styl = "stylus" } },
  { open = "{", close = "}", default = "typescript", balanced = true },
]

