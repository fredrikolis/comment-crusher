# Concern: declares the comment-crusher crate — its targets, dependencies and metadata | Non-concern: what the tool measures (src/ owns that) or the workspace-wide settings it inherits | IO: none
[package]
name = "comment-crusher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Language-agnostic comment budget: fails a file whose comment-to-code ratio, comment block, or document length exceeds the budget the repo declares."
readme = "../../README.md"
keywords = ["lint", "comments", "code-quality", "pre-commit", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "comment-crusher"
path = "src/main.rs"

[lib]
name = "comment_crusher"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
globset.workspace = true
ignore.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
