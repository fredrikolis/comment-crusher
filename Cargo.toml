# Concern: declares the workspace, its members, and the dependency versions they share | Non-concern: what any member does, or how it ships | IO: none
[workspace]
resolver = "3"
members = ["crates/comment-crusher"]

# No shared `version`: release-please cannot read a workspace-inherited one.
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/fredrikolis/comment-crusher"
authors = ["Fredrik Ryden <fredrik.ryden1@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# A heading restating a signature is the boilerplate comment this tool exists to bill for.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# A language's syntax table is a row of independent flags, not a state machine.
struct_excessive_bools = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
