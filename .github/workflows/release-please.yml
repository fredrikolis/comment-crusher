# Concern: opens and lands the release pull request, tagging from the conventional-commit history | Non-concern: the checks a commit must clear (ci.yml) | IO: (pushes to main) -> release PR, tag
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
