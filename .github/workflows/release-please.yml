# Concern: opens and lands the release pull request, on request only | Non-concern: the checks a commit must clear (ci.yml) | IO: (a manual run) -> release PR, tag
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
