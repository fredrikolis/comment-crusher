# Concern: the whole release — tag, GitHub release, binaries, crates.io and npm | Non-concern: the checks a commit clears (ci.yml) | IO: (a manual run) -> tag, release, assets, crate, npm packages
name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
      # The manifest is the one version there is, so the tag follows it rather than an input.
      - id: tag
        run: |
          set -eu
          v="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' crates/comment-crusher/Cargo.toml | head -1)"
          git tag "v$v"
          git push origin "v$v"
          echo "ref=refs/tags/v$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/create-gh-release-action@v1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          changelog: crates/comment-crusher/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cargo-zigbuild
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}
      # cargo-binstall resolves the archive by this name.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: comment-crusher
          manifest-path: crates/comment-crusher/Cargo.toml
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool || 'cargo' }}
          archive: $bin-$target
          checksum: sha256
          ref: ${{ needs.release.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      # A version already published is not a failed release: re-running one must not red here.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          # Outside the checkout: cargo publish refuses on a dirty working directory.
          err="$(mktemp)"
          if cargo publish -p comment-crusher --locked 2>"$err"; then
            exit 0
          fi
          cat "$err" >&2
          grep -qE 'already (exists|been uploaded|uploaded)' "$err"
          echo "Version already on crates.io; nothing to do."

  # No distribution/ tree: every manifest, shim and doc below is generated here, never committed.
  npm:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mints the OIDC token trusted publishing exchanges for a publish, no token stored
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Pinned, not @latest: a future npm major must not change publish/OIDC behavior for free.
      - run: npm install -g npm@11.5.1 && npm --version
      - name: Stage every npm package inline and publish
        env:
          REF: ${{ needs.release.outputs.ref }} # GITHUB_REF_NAME is the dispatching branch, not this
        run: |
          set -euo pipefail
          TAG="${REF#refs/tags/}"
          V="${TAG#v}"
          DESC="$(sed -n '/^\[package\]/,/^\[/s/^description = "\(.*\)"$/\1/p' crates/comment-crusher/Cargo.toml | head -1)"
          REPO_URL="https://github.com/fredrikolis/comment-crusher"
          STAGE="$RUNNER_TEMP/npm"
          mkdir -p "$STAGE"

          # plat            target                            os       cpu     libc
          ROWS='
          linux-x64-musl    x86_64-unknown-linux-musl          linux    x64     musl,glibc
          linux-arm64-musl  aarch64-unknown-linux-musl         linux    arm64   musl,glibc
          darwin-x64        x86_64-apple-darwin                darwin   x64     -
          darwin-arm64      aarch64-apple-darwin               darwin   arm64   -
          '

          plats=() ; names=()
          while read -r plat target os cpu libc; do
            [ -n "$plat" ] || continue
            name="comment-crusher-$plat"
            plats+=("$plat") ; names+=("$name")
            dir="$STAGE/$name"
            mkdir -p "$dir"

            # The release job already uploaded this archive; the npm job carries no Rust toolchain.
            asset="comment-crusher-$target.tar.gz"
            gh release download "$TAG" --repo "${{ github.repository }}" \
              -p "$asset" -O "$STAGE/$asset" --clobber
            tar -xzf "$STAGE/$asset" -C "$dir"
            bin="$(find "$dir" -type f -name comment-crusher)"
            [ "$bin" = "$dir/comment-crusher" ] || mv "$bin" "$dir/comment-crusher"
            chmod +x "$dir/comment-crusher"

            libc_json="[]"
            [ "$libc" = "-" ] || libc_json="$(printf '%s' "$libc" | tr ',' '\n' | jq -R . | jq -s .)"
            jq -n --arg name "$name" --arg v "$V" \
                  --arg desc "Prebuilt comment-crusher binary for $os $cpu. Installed automatically as an optional dependency of \`comment-crusher\`." \
                  --arg repo "$REPO_URL" --arg os "$os" --arg cpu "$cpu" --argjson libc "$libc_json" '
              {name: $name, version: $v, description: $desc, license: "MIT",
               repository: {type: "git", url: ($repo + ".git")},
               os: [$os], cpu: [$cpu]} + (if ($libc | length) > 0 then {libc: $libc} else {} end)
              + {files: ["comment-crusher"]}
            ' > "$dir/package.json"
          done <<< "$ROWS"

          # The wrapper: one shim, picking the platform package the host actually installed.
          wrapper="$STAGE/comment-crusher"
          mkdir -p "$wrapper/bin"
          cp LICENSE "$wrapper/LICENSE"

          cat > "$wrapper/bin/comment-crusher.js" <<'JS'
          #!/usr/bin/env node
          "use strict";
          const path = require("path");
          const { spawnSync } = require("child_process");

          const PLATFORM_PACKAGES = {
            "linux-x64": "comment-crusher-linux-x64-musl",
            "linux-arm64": "comment-crusher-linux-arm64-musl",
            "darwin-x64": "comment-crusher-darwin-x64",
            "darwin-arm64": "comment-crusher-darwin-arm64",
          };

          function resolveBinary() {
            const key = `${process.platform}-${process.arch}`;
            const pkg = PLATFORM_PACKAGES[key];
            if (!pkg) return { key, pkg: null, bin: null };
            try {
              const pkgDir = path.dirname(require.resolve(`${pkg}/package.json`));
              return { key, pkg, bin: path.join(pkgDir, "comment-crusher") };
            } catch (_err) {
              return { key, pkg, bin: null };
            }
          }

          const WRAPPER_FAILURE = 127; // the binary's own codes are verdicts about a file, not this

          function fail(message) {
            process.stderr.write(`comment-crusher: ${message}\n`);
            process.exit(WRAPPER_FAILURE);
          }

          function main() {
            const { key, pkg, bin } = resolveBinary();
            if (!pkg) {
              fail(
                `unsupported platform ${key}. No prebuilt binary is published for it. ` +
                  "Build from source instead: cargo install comment-crusher"
              );
            }
            if (!bin) {
              fail(
                `the prebuilt binary for ${key} is missing (expected package "${pkg}"). ` +
                  "Reinstall without skipping optional dependencies: npm install comment-crusher " +
                  `(do not pass --no-optional), or install "${pkg}" directly.`
              );
            }
            const r = spawnSync(bin, process.argv.slice(2), { stdio: "inherit" });
            if (r.error) fail(r.error.message);
            if (r.signal) {
              process.removeAllListeners(r.signal);
              process.kill(process.pid, r.signal);
            }
            process.exit(r.status === null ? WRAPPER_FAILURE : r.status);
          }

          main();
          JS
          # The heredoc above is indented with the step; strip that indent so node sees column-0 code.
          sed -i 's/^          //' "$wrapper/bin/comment-crusher.js"
          chmod +x "$wrapper/bin/comment-crusher.js"

          { printf '# comment-crusher\n\n%s\n\n' "$DESC"
            cat <<MD
          Installs the prebuilt binary for your platform as an optional dependency and runs it —
          no Rust toolchain needed. Full docs and the config format: $REPO_URL

          \`\`\`sh
          npx comment-crusher .
          \`\`\`

          MIT. Built from $REPO_URL
          MD
          } | sed 's/^          //' > "$wrapper/README.md"

          jq -n --arg v "$V" --arg desc "$DESC" --arg repo "$REPO_URL" \
                --argjson plats "$(printf '%s\n' "${plats[@]}" | jq -R . | jq -s .)" '
            {name: "comment-crusher", version: $v, description: $desc, license: "MIT",
             homepage: $repo, repository: {type: "git", url: ($repo + ".git")},
             keywords: ["lint", "comments", "code-quality", "pre-commit", "cli"],
             bin: {"comment-crusher": "bin/comment-crusher.js"},
             files: ["bin/comment-crusher.js"],
             engines: {node: ">=18"},
             optionalDependencies: ($plats | map({(("comment-crusher-" + .)): $v}) | add)}
          ' > "$wrapper/package.json"

          # Every dir validated before any publish, and one already up skipped: no half-release.
          for name in "${names[@]}" comment-crusher; do npm publish --dry-run "$STAGE/$name"; done
          for name in "${names[@]}" comment-crusher; do
            if npm view "$name@$V" version >/dev/null 2>&1; then
              echo "$name@$V is already published; skipping"
            else
              npm publish --access public "$STAGE/$name"
            fi
          done
